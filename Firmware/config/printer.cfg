[mcu]
serial: (insert ur serial ID here u gotta check its different between control boards)

[printer]
kinematics: corexy
max_velocity: 500
max_accel: 3000
max_z_velocity: 10
max_z_accel: 100

[stepper_x]
step_pin: PC14
dir_pin: PC13
enable_pin: !PE6
microsteps: 16
rotation_distance: 40
endstop_pin: tmc2209_stepper_x:virtual_endstop
homing_retract_dist: 0
position_endstop: 0
position_max:250

[stepper_y]
step_pin: PE5
dir_pin: PE4
enable_pin: !PE3
microsteps: 16
rotation_distance: 40
endstop_pin: tmc2209_stepper_y:virtual_endstop
homing_retract_dist: 0
position_endstop: 0
position_max: 300

[stepper_z]
step_pin: PD7
dir_pin: PD6
enable_pin: !PF10
microsteps: 16
rotation_distance:8
endstop_pin: tmc2209_stepper_z:virtual_endstop
position_max: 195
position_min: 0

[stepper_z1]
step_pin: PD3
dir_pin: PD2
enable_pin: !PD5
microsteps:16
rotation_distance: 8

[stepper_z2]
step_pin: PC9
dir_pin: PC8
enable_pin: !PD1
microsteps:16
rotation_distance: 8