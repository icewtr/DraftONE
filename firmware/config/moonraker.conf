[server]
host: 0.0.0.0
port: 7125

klippy_uds_path: ~/printer_data/comm/klippy.sock

[authorization]
trusted_clients:
    10.0.0.0/8
    127.0.0.1
    MANUAL_IP_OR_SUBNET_HERE
    # idk gng just put it here
cors_domains:
    *.local
    *.lan
    *://app.fluidd.xyz

[octoprint_compat]

[history]

[file_manager]
enable_object_processing: True

[update_manager]
channel: dev
refresh_interval: 168

[update_manager fluidd]
type: web
channel: stable
repo: fluidd-core/fluidd
path: ~/fluidd