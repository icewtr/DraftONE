[gcode_macro START_PRINT]
gcode:
{% set bed_temp= params.BED|default(65) %}
{% set extruder_temp= params.EXTRUDER|default(225) %}

m140 S{bed_temp}
m104 S{extruder_temp}

g90
g28


Z_tilt_ADJUST
g28 Z_tilt
m190 S {bed_temp}
m109 S {extruder_temp}




[gcode_macro END_PRINT]
gcode:
m104 s0
m140 s0
m106 s0

g91
g1 z10 f300

G1 X125 Y10 F3000

m84



[gcode_macro CANCEL]
gcode:
TURN_OFF_HEATERS
CLEAR_PAUSE
SDCARD_RESET
BASE_CANCEL_PRINT

g91
g1 z10 f300
g90
g1 x0 y10 f3000

[gcode_macro E_STOP]
M112