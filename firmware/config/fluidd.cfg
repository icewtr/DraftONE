[virtual_sdcard]
path: ~/printer_data/gcode
on_error_gcode: CANCEL

[pause_resume]

[display_status]

[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
gcode:
    
    {% set z = params.Z|default(10)|int %}     ; z hop amount
    
    {% if printer['pause_resume'].is_paused|int == 0 %}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=extrude_val VALUE='{printer['extruder'].temperature}'
        SAVE_GCODE_STATE NAME=PAUSE_state
        BASE_PAUSE
        G91
        
        {% if (printer.toolhead.position.z + z) < printer.toolhead.axis_maximum.z %}
            G1 Z{z} F500
        {% else %}
            G1 Z{printer.toolhead.axis_maximum.z - printer.toolhead.position.z} F500
        {% endif %}
        G90
        
        {% if printer.toolhead.axis_maximum.x > 200 %}
            G1 X10 Y10 F6000
        {% else %}
            G1 X0 Y0 F6000
        {% endif %}
        SAVE_GCODE_STATE NAME=PAUSE_park_state
    {% endif %}

[gcode_macro RESUME]
rename_existing: BASE_RESUME
gcode:
    {% if printer['pause_resume'].is_paused|int == 1 %}
        
        RESTORE_GCODE_STATE NAME=PAUSE_park_state MOVE=1 MOVE_SPEED=60
        RESTORE_GCODE_STATE NAME=PAUSE_state MOVE=1 MOVE_SPEED=60
        BASE_RESUME
    {% endif %}

[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
gcode:
    TURN_OFF_HEATERS
    CLEAR_PAUSE
    SDCARD_RESET_FILE
    BASE_CANCEL_PRINT