[include fluidd.cfg]
[include macros.cfg]
[mcu]

serial: (insert ur serial ID here u gotta check its different between control boards)

[printer]
kinematics: corexy
max_velocity: 400
max_accel: 10000
max_z_velocity: 10
max_z_accel: 100

[stepper_x]
step_pin: PC14
dir_pin: PC13
enable_pin: !PE6
microsteps: 16
rotation_distance: 40
endstop_pin: tmc2209_stepper_x:virtual_endstop
homing_retract_dist: 0
position_endstop: 0
position_max:250

[stepper_y]
step_pin: PE5
dir_pin: PE4
enable_pin: !PE3
microsteps: 16
rotation_distance: 40
endstop_pin: tmc2209_stepper_y:virtual_endstop
homing_retract_dist: 0
position_endstop: 0
position_max: 300

[tmc2209 stepper_x]
uart_pin: (insert ur pin here)
run_current: 0.8
diag_pin: ^PA14
driver_SGTHRS: 100

[tmc2209 stepper_y]
uart_pin: (insert ur pin here)
run_current: 0.8
diag_pin: ^PA15
driver_SGTHRS: 100


[stepper_z]
step_pin: PD7
dir_pin: PD6
enable_pin: !PF10
microsteps: 16
rotation_distance:8
endstop_pin: probe:z_virtual_endstop
position_max: 195
position_min: 0

[stepper_z1]
step_pin: PD3
dir_pin: PD2
enable_pin: !PD5
microsteps:16
rotation_distance: 8

[stepper_z2]
step_pin: PC9
dir_pin: PC8
enable_pin: !PD1
microsteps:16
rotation_distance: 8

[Z_tilt]
z_positions:
    113.99654, 2.41195
    27.39717, 269.71363
    288.73185, 264.50719
points:
    50, 50
    250, 50
    150, 250
speed: 50
horizontal_move_z: 5
retries: 5
retry_tolerance: 0.01    

[probe]
pin: ^PC2
x_offset: 0
y_offset: 33.5
z_offset: 2
speed: 5.0
samples: 2
sample_retract_dist: 2.0
lift_speed: 10.0

[extruder]
step_pin: PC7
dir_pin: PC6
enable_pin: !PD8
microsteps: 16
rotation_distance: 7.53
gear_ratio: 50:10
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PF3
sensor_type: Generic 3950
sensor_pin: PC1 
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 115.0
min_temp: 0
max_temp: 300

[tmc2209 extruder]
uart_pin: (insert ur pin here)
run_current: 0.75

[heater_bed]
heater_pin: PB10
sensor_type: Generic 3950
sensor_pin: PC0
control: pid 
pid_Kp: 54.027
pid_Ki: 0.770
pid_Kd: 948.182
min_temp: 0
max_temp: 120

[fan]
pin: PA8

[heater_fan hotend_fan]
pin: PB3
heater: extruder
heater_temp: 50.0